
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Информация о книге — BookSpace</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/custom.css">
</head>

<body>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                BookSpace ヾ(＾-＾)ノ
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Открыть меню"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Главная
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="catalog.html">
                            Каталог
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="library.html">
                            Моя библиотека
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="faq.html">
                            FAQ
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <main class="py-5">
        <div class="container">

            <a href="catalog.html" class="book-back-link">
                ← Вернуться в каталог
            </a>

            <!-- Информация о книге -->
            <section id="bookDetails" class="row g-5 mt-2 d-none">

                <!-- Обложка -->
                <div class="col-12 col-md-4">
                    <img
                        id="bookImage"
                        class="book-detail-image"
                        src=""
                        alt=""
                    >
                </div>

                <!-- Основная информация -->
                <div class="col-12 col-md-8">

                    <h1 id="bookTitle" class="mb-3"></h1>

                    <p class="book-detail-author">
                        <strong>Автор:</strong>
                        <span id="bookAuthor"></span>
                    </p>

                    <p class="mb-4">
                        <strong>Жанр:</strong>
                        <span id="bookGenre"></span>
                    </p>

                    <h2 class="h4 mb-3">Описание</h2>

                    <div
                        id="bookDescription"
                        class="book-description mb-4"
                    ></div>

                    <!-- Добавление в библиотеку -->
                    <div class="book-actions p-4">

                        <h2 class="h5 mb-3">
                            Добавить в мою библиотеку
                        </h2>

                        <label for="bookStatus" class="form-label">
                            Статус чтения
                        </label>

                        <select
                            id="bookStatus"
                            class="form-select mb-3"
                        >
                            <option value="planned">
                                Хочу прочитать
                            </option>
                            <option value="reading">
                                Читаю
                            </option>
                            <option value="finished">
                                Прочитано
                            </option>
                        </select>

                        <button
                            id="addToLibraryBtn"
                            class="btn btn-book"
                            type="button"
                        >
                            Добавить в библиотеку
                        </button>

                        <p
                            id="bookMessage"
                            class="mt-3 mb-0"
                            role="status"
                            aria-live="polite"
                        ></p>

                    </div>

                </div>
            </section>

            <!-- Если книга не найдена -->
            <div id="bookNotFound" class="text-center py-5 d-none">
                <h1 class="h3">Книга не найдена</h1>
                <p>Возможно, ссылка указана неправильно.</p>
                <a href="catalog.html" class="btn btn-book">
                    Перейти в каталог
                </a>
            </div>

        </div>
    </main>

    <!-- Подвал -->
    <footer class="site-footer py-4">
        <div class="container text-center">

            <p class="mb-1 fw-bold">BookSpace</p>

            <p class="mb-3">
                Твоя вселенная книг
            </p>

            <p class="mb-0">
                © 2026 BookSpace. Все права защищены.
            </p>

        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="js/book.js"></script>

</body>
</html>
